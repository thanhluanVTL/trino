version: "3.3"
services:
  key-provider:
    image: key-provider:latest
    build:
      context: ./key-provider
      dockerfile: Dockerfile
    container_name: key-provider
    env_file:
      - ./key-provider/.env
    ports:
      - "9000:8000"
    healthcheck:
      test: bash -c "exec 6<> /dev/tcp/localhost/8000"
    networks:
      - trino-cluster-net

#   pgadmin:
#     image: dpage/pgadmin4:latest
#     container_name: pgadmin
#     ports:
#       - "9090:80"
#     environment:
#       PGADMIN_DEFAULT_EMAIL: admin@example.com
#       PGADMIN_DEFAULT_PASSWORD: admin
#     volumes:
#       - ./data/pgadmin:/var/lib/pgadmin
#     restart: unless-stopped
#     healthcheck:
#       test: bash -c "exec 6<> /dev/tcp/localhost/80"
#     networks:
#       - trino-cluster-net
  
  postgres:
    image: postgres:15.1
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trino
      POSTGRES_PASSWORD: trino
      POSTGRES_DB: trinodb
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: bash -c "exec 6<> /dev/tcp/localhost/5432"
    networks:
      - trino-cluster-net

  coordinator:
    image: trino:472
    build:
      context: ./trino
      dockerfile: Dockerfile
    container_name: coordinator
    env_file:
      - ./trino/.env
    ports:
      - "8080:8080"  # HTTP
      - "8443:8443"  # HTTPS
    volumes:
      - ./trino/config/coordinator/config.properties:/etc/trino/config.properties
      - ./trino/config/coordinator/jvm.config:/etc/trino/jvm.config
      - ./trino/config/coordinator/node.properties:/etc/trino/node.properties
      # - ./trino/config/coordinator/access-control.properties:/etc/trino/access-control.properties
      - ./trino/config/coordinator/password-authenticator.properties:/etc/trino/password-authenticator.properties
      - ./trino/config/access-control/access-control.json:/etc/trino/access-control/access-control.json
      - ./trino/config/password/password.db:/etc/trino/password/password.db
      - ./trino/config/catalog:/etc/trino/catalog
    healthcheck:
      test: bash -c "exec 6<> /dev/tcp/localhost/8080"
    depends_on:
      key-provider:
        condition: service_healthy
    networks:
      - trino-cluster-net

  # # # worker1:
  # # #   image: trino:472 # Use the image name from your Dockerfile. Or build from the local Dockerfile:  `build: .`
  # # #   build:
  # # #     context: .
  # # #     dockerfile: Dockerfile
  # # #   container_name: worker1
  # # #   volumes:
  # # #     - ./config/worker/config.properties:/etc/trino/config.properties
  # # #     - ./config/worker/jvm.config:/etc/trino/jvm.config
