  # # #     - trino-cluster-net
  # # #   depends_on:
  # # #     - coordinator

  superset:
    image: superset:4.1.1
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: superset
    env_file:
      - ./superset/.env
    ports:
      - "8088:8088"
    volumes:
      - ./data/superset:/app/superset_home
    restart: unless-stopped
    healthcheck:
      test: bash -c "exec 6<> /dev/tcp/localhost/8088"
    depends_on:
      key-provider:
        condition: service_healthy
    networks:
      - trino-cluster-net

networks:
  trino-cluster-net:
    driver: bridge